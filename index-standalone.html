<!DOCTYPE HTML>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script>
    /* Inline Service Worker Setup */
    (async function () {
      if (!("serviceWorker" in navigator)) return;
      
      // Create an inline service worker blob
      const coiWorkerCode = `
/* coi-serviceworker v0.1.7 - MIT License - https://github.com/gzuidhof/coi-serviceworker */
self.addEventListener("install", () => self.skipWaiting());
self.addEventListener("activate", (e) => e.waitUntil(self.clients.claim()));

self.addEventListener("fetch", function (event) {
  if (event.request.cache === "only-if-cached" && event.request.mode !== "same-origin") {
    return;
  }

  event.respondWith(
    fetch(event.request)
      .then(function (response) {
        if (response.status === 0) {
          return response;
        }

        const newHeaders = new Headers(response.headers);
        newHeaders.set("Cross-Origin-Opener-Policy", "same-origin");
        newHeaders.set("Cross-Origin-Embedder-Policy", "require-corp");
        newHeaders.set("Cross-Origin-Resource-Policy", "cross-origin");

        return new Response(response.body, {
          status: response.status,
          statusText: response.statusText,
          headers: newHeaders,
        });
      })
      .catch((e) => console.error(e))
  );
});
      `;

      const blob = new Blob([coiWorkerCode], { type: 'application/javascript' });
      const workerUrl = URL.createObjectURL(blob);
      
      const alreadyIsolated = self.crossOriginIsolated;
      const hasCOI = navigator.serviceWorker.controller?.scriptURL?.includes('blob:');
      if (alreadyIsolated && hasCOI) {
        console.log("[COI] Already cross-origin isolated, game will load.");
        return;
      }
      
      const regs = await navigator.serviceWorker.getRegistrations();
      console.log("[COI] Found " + regs.length + " service worker(s), unregistering all...");
      await Promise.all(regs.map(r => {
        console.log("[COI] Unregistering: " + (r.active?.scriptURL || r.scope));
        return r.unregister();
      }));
      
      console.log("[COI] Registering inline coi-serviceworker...");
      const reg = await navigator.serviceWorker.register(workerUrl, { scope: "./" });
      const sw = reg.installing || reg.waiting || reg.active;
      if (sw && sw.state !== "activated") {
        console.log("[COI] Waiting for SW to activate...");
        await new Promise(resolve => {
          sw.addEventListener("statechange", function handler(e) {
            console.log("[COI] SW state: " + e.target.state);
            if (e.target.state === "activated") {
              sw.removeEventListener("statechange", handler);
              resolve();
            }
          });
        });
      }
      console.log("[COI] SW activated, reloading for isolation...");
      location.reload();
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #f4720b;
      --orange-dim: #a34d08;
      --blue: #4dc8f4;
      --blue-dim: #1a6a8a;
      --bg: #0a0a0a;
      --surface: #111214;
      --surface2: #16181c;
      --border: #1e2124;
      --text: #c8cdd4;
      --text-dim: #555c66;
      --glow-orange: 0 0 20px rgba(244,114,11,0.4);
      --glow-blue: 0 0 20px rgba(77,200,244,0.3);
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }

    /* Subtle scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 1000;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 0;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 1280px;
      max-width: 100%;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-area img {
      width: 52px;
      height: 52px;
      filter: drop-shadow(var(--glow-orange));
    }

    .title-block {
      display: flex;
      flex-direction: column;
    }

    .title-main {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #fff 0%, var(--blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .title-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Status pill */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      min-width: 180px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.active {
      background: var(--orange);
      box-shadow: 0 0 8px var(--orange);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Fullscreen button */
    .btn-fullscreen {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--orange-dim);
      color: var(--orange);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 7px 18px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .btn-fullscreen:hover {
      background: rgba(244,114,11,0.1);
      border-color: var(--orange);
      box-shadow: var(--glow-orange);
    }

    .btn-fullscreen svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* ── Fake fullscreen overlay ── */
    #fsOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: #000;
      align-items: center;
      justify-content: center;
    }
    #fsOverlay.active {
      display: flex;
    }
    #fsOverlay canvas {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      border: none !important;
      outline: none;
      display: block;
    }

    /* Hold-ESC exit UI */
    #escHint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #escHint.visible { opacity: 1; }

    #escRing {
      position: relative;
      width: 52px;
      height: 52px;
    }
    #escRing svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }
    #escRing .track {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-width: 3;
    }
    #escRing .fill {
      fill: none;
      stroke: var(--orange);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 138.2;
      stroke-dashoffset: 138.2;
      transition: stroke-dashoffset 0.05s linear;
      filter: drop-shadow(0 0 6px var(--orange));
    }
    #escLabel {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      text-align: center;
      line-height: 1.4;
    }

    /* ── Download toast (fullscreen, top-right) ── */
    #dlToast {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 9200;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 260px;
      max-width: 340px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #dlToast.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .dl-toast-inner {
      background: rgba(17,18,20,0.92);
      border: 1px solid var(--border);
      border-left: 2px solid var(--blue);
      border-radius: 4px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.6), var(--glow-blue);
    }
    .dl-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--blue);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .dl-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    .dl-bar-wrap {
      width: 100%;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .dl-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue-dim), var(--blue));
      border-radius: 2px;
      transition: width 0.25s ease;
      box-shadow: 0 0 6px var(--blue);
    }
    .dl-pct {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-top: 5px;
      text-align: right;
    }

    /* ── Canvas frame ── */
    .canvas-frame {
      position: relative;
      width: 1280px;
      max-width: 100%;
    }

    /* Corner decorations */
    .canvas-frame::before,
    .canvas-frame::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 2;
      pointer-events: none;
    }
    .canvas-frame::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--orange);
      border-left: 2px solid var(--orange);
    }
    .canvas-frame::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--blue);
      border-right: 2px solid var(--blue);
    }

    .corner-tr, .corner-bl {
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 2;
      pointer-events: none;
    }
    .corner-tr {
      top: -1px; right: -1px;
      border-top: 2px solid var(--blue);
      border-right: 2px solid var(--blue);
    }
    .corner-bl {
      bottom: -1px; left: -1px;
      border-bottom: 2px solid var(--orange);
      border-left: 2px solid var(--orange);
    }

    canvas#canvas {
      display: block;
      width: 1280px;
      height: 800px;
      max-width: 100%;
      background: #000;
      outline: none;
      border: 1px solid var(--border);
    }

    /* Loading overlay — shown until game starts */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 10;
    }

    .loading-overlay.hidden {
      opacity: 0;
    }

    .portal-rings {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 3px solid transparent;
      animation: spin 2s linear infinite;
    }

    .ring-1 {
      inset: 0;
      border-top-color: var(--orange);
      border-right-color: var(--orange);
      animation-duration: 1.8s;
    }

    .ring-2 {
      inset: 10px;
      border-bottom-color: var(--blue);
      border-left-color: var(--blue);
      animation-duration: 1.2s;
      animation-direction: reverse;
    }

    .ring-3 {
      inset: 22px;
      border-top-color: rgba(244,114,11,0.5);
      animation-duration: 2.4s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .progress-wrap {
      width: 260px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--orange), var(--blue));
      transition: width 0.3s ease;
      border-radius: 2px;
    }

    /* ── Footer / log ── */
    .footer {
      width: 1280px;
      max-width: 100%;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .log-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    textarea#output {
      width: 100%;
      height: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: #4a7a4a;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      line-height: 1.6;
      padding: 10px 14px;
      resize: none;
      outline: none;
    }

    textarea#output:focus {
      border-color: var(--orange-dim);
    }

    /* ════════════════════════════════════════════
       SIDE PANEL TABS (edge toggles)
    ════════════════════════════════════════════ */
    .panel-tab {
      position: fixed;
      top: 50%;
      z-index: 600;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px 7px;
      writing-mode: vertical-rl;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      user-select: none;
      transition: color 0.2s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .panel-tab-left {
      left: 0;
      transform: translateY(-50%) rotate(180deg);
      border-left: none;
      border-radius: 0 4px 4px 0;
      color: var(--orange-dim);
    }
    .panel-tab-left:hover, .panel-tab-left.open {
      color: var(--orange);
      border-color: var(--orange-dim);
      box-shadow: 3px 0 16px rgba(244,114,11,0.25);
      background: rgba(244,114,11,0.05);
    }

    .panel-tab-right {
      right: 0;
      transform: translateY(-50%);
      border-right: none;
      border-radius: 4px 0 0 4px;
      color: var(--blue-dim);
    }
    .panel-tab-right:hover, .panel-tab-right.open {
      color: var(--blue);
      border-color: var(--blue-dim);
      box-shadow: -3px 0 16px rgba(77,200,244,0.25);
      background: rgba(77,200,244,0.05);
    }

    .panel-tab-icon {
      font-size: 14px;
      line-height: 1;
    }

    /* ════════════════════════════════════════════
       SIDE PANELS
    ════════════════════════════════════════════ */
    .side-panel {
      position: fixed;
      top: 0;
      bottom: 0;
      z-index: 550;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .side-panel-left {
      left: 0;
      width: 310px;
      background: var(--surface);
      border-right: 1px solid var(--orange-dim);
      box-shadow: 4px 0 32px rgba(0,0,0,0.7);
      transform: translateX(-100%);
    }
    .side-panel-left.open {
      transform: translateX(0);
    }

    .side-panel-right {
      right: 0;
      width: 400px;
      background: #0b0e0b;
      border-left: 1px solid var(--blue-dim);
      box-shadow: -4px 0 32px rgba(0,0,0,0.7);
      transform: translateX(100%);
    }
    .side-panel-right.open {
      transform: translateX(0);
    }

    /* Panel shared header */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .panel-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .side-panel-left .panel-title { color: var(--orange); }
    .side-panel-right .panel-title { color: var(--blue); }

    .panel-title-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }
    .side-panel-left .panel-title-dot { background: var(--orange); box-shadow: 0 0 6px var(--orange); }
    .side-panel-right .panel-title-dot { background: var(--blue); box-shadow: 0 0 6px var(--blue); }

    .panel-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 2px 5px;
      font-size: 18px;
      line-height: 1;
      transition: color 0.2s;
      font-family: monospace;
    }
    .panel-close:hover { color: var(--text); }

    /* ════════════════════════════════════════════
       CACHE PANEL
    ════════════════════════════════════════════ */
    .cache-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .cache-status-bar {
      background: rgba(244,114,11,0.06);
      border: 1px solid rgba(244,114,11,0.15);
      border-radius: 3px;
      padding: 8px 12px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cache-status-count {
      color: var(--orange);
      font-size: 11px;
      font-weight: bold;
    }

    .cache-section {
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .cache-section-header {
      background: rgba(255,255,255,0.025);
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .section-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.1em;
      padding: 2px 6px;
      border-radius: 2px;
      margin-left: auto;
    }
    .badge-orange { background: rgba(244,114,11,0.15); color: var(--orange); border: 1px solid rgba(244,114,11,0.3); }
    .badge-blue   { background: rgba(77,200,244,0.1);  color: var(--blue);   border: 1px solid rgba(77,200,244,0.25); }

    .cache-section-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .cache-file-list {
      max-height: 110px;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      border-radius: 3px;
      padding: 6px 8px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .cache-file-item {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--text-dim);
      padding: 1px 0;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cache-file-item::before {
      content: '';
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .cache-file-item.cached { color: #4a7a4a; }
    .cache-file-item.cached::before { background: #4a7a4a; }
    .cache-file-item.failed { color: #7a3a3a; }
    .cache-file-item.failed::before { background: #7a3a3a; }

    .btn-cache-action {
      background: transparent;
      border: 1px solid var(--orange-dim);
      color: var(--orange);
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, opacity 0.2s;
      width: 100%;
    }
    .btn-cache-action:hover:not(:disabled) {
      background: rgba(244,114,11,0.1);
      box-shadow: var(--glow-orange);
    }
    .btn-cache-action:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-cache-maps {
      border-color: var(--blue-dim);
      color: var(--blue);
    }
    .btn-cache-maps:hover:not(:disabled) {
      background: rgba(77,200,244,0.08);
      box-shadow: var(--glow-blue);
    }

    .btn-reset-cache {
      background: transparent;
      border: 1px solid #4a1818;
      color: #b03030;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      width: 100%;
    }
    .btn-reset-cache:hover {
      background: rgba(176,48,48,0.1);
      border-color: #7a2020;
    }

    /* Map selection */
    .map-controls-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-map-sel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 2px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-map-sel:hover { color: var(--text); border-color: var(--text-dim); }

    .map-list {
      max-height: 185px;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      border-radius: 3px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .map-checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 2px;
      border-radius: 2px;
      transition: background 0.15s;
      cursor: pointer;
    }
    .map-checkbox-item:hover { background: rgba(255,255,255,0.04); }

    .map-checkbox-item input[type="checkbox"] {
      accent-color: var(--blue);
      width: 12px;
      height: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .map-checkbox-item label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--text);
      letter-spacing: 0.06em;
      cursor: pointer;
      flex: 1;
    }

    .map-cached-indicator {
      font-family: 'Share Tech Mono', monospace;
      font-size: 8px;
      color: #4a7a4a;
      letter-spacing: 0.05em;
    }

    /* ════════════════════════════════════════════
       CACHE LOADING OVERLAY
    ════════════════════════════════════════════ */
    #cacheLoadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9500;
      background: rgba(0,0,0,0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }
    #cacheLoadingOverlay.active { display: flex; }

    .cache-loading-box {
      background: var(--surface);
      border: 1px solid var(--orange-dim);
      border-radius: 6px;
      padding: 36px 44px;
      width: 440px;
      max-width: 92vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      box-shadow: var(--glow-orange), 0 12px 60px rgba(0,0,0,0.9);
    }

    .cache-loading-rings {
      position: relative;
      width: 60px;
      height: 60px;
    }
    .cache-loading-rings .ring { border-width: 2px; }
    .cache-loading-rings .ring-1 { inset: 0; animation-duration: 1.6s; }
    .cache-loading-rings .ring-2 { inset: 8px; animation-duration: 1.1s; }
    .cache-loading-rings .ring-3 { inset: 18px; animation-duration: 2.2s; }

    .cache-loading-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--orange);
      text-transform: uppercase;
    }

    .cache-loading-file {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.07em;
      text-align: center;
      min-height: 16px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cache-loading-pct {
      font-family: 'Share Tech Mono', monospace;
      font-size: 36px;
      font-weight: 300;
      color: var(--text);
      letter-spacing: 0.05em;
      line-height: 1;
    }

    .cache-loading-progress-wrap {
      width: 100%;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    #cacheProgressFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--orange), var(--blue));
      border-radius: 2px;
      transition: width 0.3s ease;
      box-shadow: 0 0 10px var(--orange);
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header">
      <div class="logo-area">
        <!-- Logo placeholder - update with your logo -->
        <div style="width: 52px; height: 52px; background: rgba(244,114,11,0.2); border-radius: 4px;"></div>
        <div class="title-block">
          <div class="title-main">PORTAL</div>
          <div class="title-sub">STANDALONE</div>
        </div>
      </div>
      <div class="header-right">
        <div class="status-pill">
          <div class="status-dot active"></div>
          <span>ONLINE</span>
        </div>
        <button class="btn-fullscreen" id="btnFullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          FULLSCREEN
        </button>
      </div>
    </div>

    <div class="canvas-frame">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="portal-rings">
          <div class="ring ring-1"></div>
          <div class="ring ring-2"></div>
          <div class="ring ring-3"></div>
        </div>
        <div class="loading-text">INITIALIZING...</div>
        <div class="progress-wrap">
          <div class="progress-bar-inner" id="progressBar"></div>
        </div>
      </div>
      <canvas id="canvas" width="1280" height="800"></canvas>
      <div class="corner-tr"></div>
      <div class="corner-bl"></div>
    </div>

    <div class="footer">
      <div class="log-header">System Log</div>
      <textarea id="output" readonly></textarea>
    </div>
  </div>

  <!-- Fullscreen overlay -->
  <div id="fsOverlay"></div>

  <!-- ESC hint -->
  <div id="escHint">
    <div id="escRing">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle class="track" cx="26" cy="26" r="23" />
        <circle class="fill" cx="26" cy="26" r="23" />
      </svg>
    </div>
    <div id="escLabel">Hold ESC<br/>to Exit</div>
  </div>

  <!-- Download toast -->
  <div id="dlToast">
    <div class="dl-toast-inner">
      <div class="dl-label">DOWNLOADING</div>
      <div class="dl-name" id="dlName">file.dat</div>
      <div class="dl-bar-wrap">
        <div class="dl-bar-fill" id="dlBarFill"></div>
      </div>
      <div class="dl-pct" id="dlPct">0%</div>
    </div>
  </div>

  <!-- Cache loading overlay -->
  <div id="cacheLoadingOverlay">
    <div class="cache-loading-box">
      <div class="cache-loading-rings">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
      </div>
      <div class="cache-loading-title">LOADING CACHE</div>
      <div class="cache-loading-file" id="cacheLoadingFile">assets/terrain.dat</div>
      <div class="cache-loading-pct" id="cacheLoadingPct">0%</div>
      <div class="cache-loading-progress-wrap">
        <div id="cacheProgressFill"></div>
      </div>
    </div>
  </div>

  <!-- Side panel tabs -->
  <div class="panel-tab panel-tab-left" id="cachePanelTab">
    <div class="panel-tab-icon">📦</div>
    <span>CACHE</span>
  </div>
  <div class="panel-tab panel-tab-right" id="mapPanelTab">
    <div class="panel-tab-icon">🗺️</div>
    <span>MAPS</span>
  </div>

  <!-- Side panels (for future implementation) -->
  <div class="side-panel side-panel-left" id="cachePanel">
    <div class="panel-header">
      <div class="panel-title">
        <div class="panel-title-dot"></div>
        CACHE SYSTEM
      </div>
      <button class="panel-close" id="closeCachePanel">×</button>
    </div>
    <div class="cache-panel-body">
      <div class="cache-status-bar">
        <span>MEMORY USAGE</span>
        <span class="cache-status-count" id="cacheCount">0 MB</span>
      </div>
    </div>
  </div>

  <div class="side-panel side-panel-right" id="mapPanel">
    <div class="panel-header">
      <div class="panel-title">
        <div class="panel-title-dot"></div>
        MAP SELECTION
      </div>
      <button class="panel-close" id="closeMapPanel">×</button>
    </div>
    <div class="cache-panel-body">
      <p style="color: var(--text-dim); font-size: 12px;">Maps will load here...</p>
    </div>
  </div>

  <script>
    // ================================================================
    // GAME/APPLICATION INITIALIZATION
    // This section loads the hl2_launcher.js and initializes the app
    // ================================================================

    console.log('Portal Standalone Initializer loaded');

    // Update progress bar
    function updateProgress(percent) {
      const bar = document.getElementById('progressBar');
      if (bar) bar.style.width = percent + '%';
    }

    // Log output
    function logOutput(message) {
      const output = document.getElementById('output');
      if (output) {
        output.value += message + '\n';
        output.scrollTop = output.scrollHeight;
      }
    }

    // Initialize the application
    async function initializeApp() {
      try {
        updateProgress(10);
        logOutput('[INIT] Starting Portal Application...');

        updateProgress(25);
        logOutput('[INIT] Loading game engine...');
        
        // Try to fetch hl2_launcher.js
        try {
          const scriptUrl = './hl2_launcher.js';
          const script = document.createElement('script');
          script.src = scriptUrl;
          script.onload = () => {
            updateProgress(75);
            logOutput('[INIT] Game engine loaded successfully');
            updateProgress(100);
            setTimeout(() => {
              const overlay = document.getElementById('loadingOverlay');
              if (overlay) overlay.classList.add('hidden');
              logOutput('[INIT] Application ready');
            }, 500);
          };
          script.onerror = () => {
            logOutput('[ERROR] Failed to load hl2_launcher.js');
            logOutput('[INFO] Make sure hl2_launcher.js is in the same directory');
            updateProgress(100);
            setTimeout(() => {
              const overlay = document.getElementById('loadingOverlay');
              if (overlay) overlay.classList.add('hidden');
            }, 1000);
          };
          document.head.appendChild(script);
        } catch (e) {
          logOutput('[ERROR] ' + e.message);
          updateProgress(100);
          const overlay = document.getElementById('loadingOverlay');
          if (overlay) overlay.classList.add('hidden');
        }
      } catch (error) {
        logOutput('[FATAL ERROR] ' + error.message);
        updateProgress(100);
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) overlay.classList.add('hidden');
      }
    }

    // Panel toggle handlers
    document.getElementById('cachePanelTab')?.addEventListener('click', function() {
      const panel = document.getElementById('cachePanel');
      panel.classList.toggle('open');
      this.classList.toggle('open');
    });

    document.getElementById('mapPanelTab')?.addEventListener('click', function() {
      const panel = document.getElementById('mapPanel');
      panel.classList.toggle('open');
      this.classList.toggle('open');
    });

    document.getElementById('closeCachePanel')?.addEventListener('click', function() {
      document.getElementById('cachePanel').classList.remove('open');
      document.getElementById('cachePanelTab').classList.remove('open');
    });

    document.getElementById('closeMapPanel')?.addEventListener('click', function() {
      document.getElementById('mapPanel').classList.remove('open');
      document.getElementById('mapPanelTab').classList.remove('open');
    });

    // Fullscreen button
    document.getElementById('btnFullscreen')?.addEventListener('click', function() {
      const canvas = document.getElementById('canvas');
      const overlay = document.getElementById('fsOverlay');
      if (canvas && overlay) {
        overlay.classList.add('active');
        overlay.appendChild(canvas.cloneNode(true));
      }
    });

    // Start initialization when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeApp);
    } else {
      initializeApp();
    }
  </script>
</body>
</html>
