<!DOCTYPE HTML>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script>
    /* Inline Service Worker Setup */
    (async function () {
      if (!("serviceWorker" in navigator)) return;
      
      // Create an inline service worker blob
      const coiWorkerCode = `
/* coi-serviceworker v0.1.7 - MIT License - https://github.com/gzuidhof/coi-serviceworker */
self.addEventListener("install", () => self.skipWaiting());
self.addEventListener("activate", (e) => e.waitUntil(self.clients.claim()));

self.addEventListener("fetch", function (event) {
  if (event.request.cache === "only-if-cached" && event.request.mode !== "same-origin") {
    return;
  }

  event.respondWith(
    fetch(event.request)
      .then(function (response) {
        if (response.status === 0) {
          return response;
        }

        const newHeaders = new Headers(response.headers);
        newHeaders.set("Cross-Origin-Opener-Policy", "same-origin");
        newHeaders.set("Cross-Origin-Embedder-Policy", "require-corp");
        newHeaders.set("Cross-Origin-Resource-Policy", "cross-origin");

        return new Response(response.body, {
          status: response.status,
          statusText: response.statusText,
          headers: newHeaders,
        });
      })
      .catch((e) => console.error(e))
  );
});
      `;

      const blob = new Blob([coiWorkerCode], { type: 'application/javascript' });
      const workerUrl = URL.createObjectURL(blob);
      
      const alreadyIsolated = self.crossOriginIsolated;
      const hasCOI = navigator.serviceWorker.controller?.scriptURL?.includes('blob:');
      if (alreadyIsolated && hasCOI) {
        console.log("[COI] Already cross-origin isolated, game will load.");
        return;
      }
      
      const regs = await navigator.serviceWorker.getRegistrations();
      console.log("[COI] Found " + regs.length + " service worker(s), unregistering all...");
      await Promise.all(regs.map(r => {
        console.log("[COI] Unregistering: " + (r.active?.scriptURL || r.scope));
        return r.unregister();
      }));
      
      console.log("[COI] Registering inline coi-serviceworker...");
      const reg = await navigator.serviceWorker.register(workerUrl, { scope: "./" });
      const sw = reg.installing || reg.waiting || reg.active;
      if (sw && sw.state !== "activated") {
        console.log("[COI] Waiting for SW to activate...");
        await new Promise(resolve => {
          sw.addEventListener("statechange", function handler(e) {
            console.log("[COI] SW state: " + e.target.state);
            if (e.target.state === "activated") {
              sw.removeEventListener("statechange", handler);
              resolve();
            }
          });
        });
      }
      console.log("[COI] SW activated, reloading for isolation...");
      location.reload();
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #f4720b;
      --orange-dim: #a34d08;
      --blue: #4dc8f4;
      --blue-dim: #1a6a8a;
      --bg: #0a0a0a;
      --surface: #111214;
      --surface2: #16181c;
      --border: #1e2124;
      --text: #c8cdd4;
      --text-dim: #555c66;
      --glow-orange: 0 0 20px rgba(244,114,11,0.4);
      --glow-blue: 0 0 20px rgba(77,200,244,0.3);
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }

    /* Subtle scanline overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 1000;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      gap: 0;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 1280px;
      max-width: 100%;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-area img {
      width: 52px;
      height: 52px;
      filter: drop-shadow(var(--glow-orange));
    }

    .title-block {
      display: flex;
      flex-direction: column;
    }

    .title-main {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #fff 0%, var(--blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    .title-sub {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Status pill */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      min-width: 180px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .status-dot.active {
      background: var(--orange);
      box-shadow: 0 0 8px var(--orange);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Fullscreen button */
    .btn-fullscreen {
      display: flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--orange-dim);
      color: var(--orange);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 7px 18px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .btn-fullscreen:hover {
      background: rgba(244,114,11,0.1);
      border-color: var(--orange);
      box-shadow: var(--glow-orange);
    }

    .btn-fullscreen svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* ── Fake fullscreen overlay ── */
    #fsOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: #000;
      align-items: center;
      justify-content: center;
    }
    #fsOverlay.active {
      display: flex;
    }
    #fsOverlay canvas {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      border: none !important;
      outline: none;
      display: block;
    }

    /* Hold-ESC exit UI */
    #escHint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #escHint.visible { opacity: 1; }

    #escRing {
      position: relative;
      width: 52px;
      height: 52px;
    }
    #escRing svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }
    #escRing .track {
      fill: none;
      stroke: rgba(255,255,255,0.1);
      stroke-width: 3;
    }
    #escRing .fill {
      fill: none;
      stroke: var(--orange);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 138.2;
      stroke-dashoffset: 138.2;
      transition: stroke-dashoffset 0.05s linear;
      filter: drop-shadow(0 0 6px var(--orange));
    }
    #escLabel {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      text-align: center;
      line-height: 1.4;
    }

    /* ── Download toast (fullscreen, top-right) ── */
    #dlToast {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 9200;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 260px;
      max-width: 340px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #dlToast.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .dl-toast-inner {
      background: rgba(17,18,20,0.92);
      border: 1px solid var(--border);
      border-left: 2px solid var(--blue);
      border-radius: 4px;
      padding: 10px 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 24px rgba(0,0,0,0.6), var(--glow-blue);
    }
    .dl-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--blue);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .dl-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    .dl-bar-wrap {
      width: 100%;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .dl-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue-dim), var(--blue));
      border-radius: 2px;
      transition: width 0.25s ease;
      box-shadow: 0 0 6px var(--blue);
    }
    .dl-pct {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      margin-top: 5px;
      text-align: right;
    }

    /* ── Canvas frame ── */
    .canvas-frame {
      position: relative;
      width: 1280px;
      max-width: 100%;
    }

    /* Corner decorations */
    .canvas-frame::before,
    .canvas-frame::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 2;
      pointer-events: none;
    }
    .canvas-frame::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--orange);
      border-left: 2px solid var(--orange);
    }
    .canvas-frame::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--blue);
      border-right: 2px solid var(--blue);
    }

    .corner-tr, .corner-bl {
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 2;
      pointer-events: none;
    }
    .corner-tr {
      top: -1px; right: -1px;
      border-top: 2px solid var(--blue);
      border-right: 2px solid var(--blue);
    }
    .corner-bl {
      bottom: -1px; left: -1px;
      border-bottom: 2px solid var(--orange);
      border-left: 2px solid var(--orange);
    }

    canvas#canvas {
      display: block;
      width: 1280px;
      height: 800px;
      max-width: 100%;
      background: #000;
      outline: none;
      border: 1px solid var(--border);
    }

    /* Loading overlay — shown until game starts */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 10;
    }

    .loading-overlay.hidden {
      opacity: 0;
    }

    .portal-rings {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 3px solid transparent;
      animation: spin 2s linear infinite;
    }

    .ring-1 {
      inset: 0;
      border-top-color: var(--orange);
      border-right-color: var(--orange);
      animation-duration: 1.8s;
    }

    .ring-2 {
      inset: 10px;
      border-bottom-color: var(--blue);
      border-left-color: var(--blue);
      animation-duration: 1.2s;
      animation-direction: reverse;
    }

    .ring-3 {
      inset: 22px;
      border-top-color: rgba(244,114,11,0.5);
      animation-duration: 2.4s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.25em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .progress-wrap {
      width: 260px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--orange), var(--blue));
      transition: width 0.3s ease;
      border-radius: 2px;
    }

    /* ── Footer / log ── */
    .footer {
      width: 1280px;
      max-width: 100%;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .log-header::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    textarea#output {
      width: 100%;
      height: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: #4a7a4a;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      line-height: 1.6;
      padding: 10px 14px;
      resize: none;
      outline: none;
    }

    textarea#output:focus {
      border-color: var(--orange-dim);
    }

    /* ════════════════════════════════════════════
       SIDE PANEL TABS (edge toggles)
    ════════════════════════════════════════════ */
    .panel-tab {
      position: fixed;
      top: 50%;
      z-index: 600;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px 7px;
      writing-mode: vertical-rl;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      user-select: none;
      transition: color 0.2s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .panel-tab-left {
      left: 0;
      transform: translateY(-50%) rotate(180deg);
      border-left: none;
      border-radius: 0 4px 4px 0;
      color: var(--orange-dim);
    }
    .panel-tab-left:hover, .panel-tab-left.open {
      color: var(--orange);
      border-color: var(--orange-dim);
      box-shadow: 3px 0 16px rgba(244,114,11,0.25);
      background: rgba(244,114,11,0.05);
    }

    .panel-tab-right {
      right: 0;
      transform: translateY(-50%);
      border-right: none;
      border-radius: 4px 0 0 4px;
      color: var(--blue-dim);
    }
    .panel-tab-right:hover, .panel-tab-right.open {
      color: var(--blue);
      border-color: var(--blue-dim);
      box-shadow: -3px 0 16px rgba(77,200,244,0.25);
      background: rgba(77,200,244,0.05);
    }

    .panel-tab-icon {
      font-size: 14px;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="header">
      <div class="logo-area">
        <div style="width: 52px; height: 52px; background: rgba(244,114,11,0.2); border-radius: 4px;"></div>
        <div class="title-block">
          <div class="title-main">PORTAL</div>
          <div class="title-sub">TRUE STANDALONE</div>
        </div>
      </div>
      <div class="header-right">
        <div class="status-pill">
          <div class="status-dot active"></div>
          <span id="statusText">LOADING</span>
        </div>
        <button class="btn-fullscreen" id="btnFullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          FULLSCREEN
        </button>
      </div>
    </div>

    <div class="canvas-frame">
      <div class="loading-overlay" id="loadingOverlay">

    <div class="footer">

  <!-- Fullscreen overlay -->
  <div id="fsOverlay"></div>

  <!-- ESC hint -->
  <div id="escHint">
    <div id="escRing">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle class="track" cx="26" cy="26" r="23" />
        <circle class="fill" cx="26" cy="26" r="23" />
      </svg>
    </div>
    <div id="escLabel">Hold ESC<br/>to Exit</div>
  </div>

  <!-- Download toast -->
  <div id="dlToast">
    <div class="dl-toast-inner">
      <div class="dl-label">DOWNLOADING</div>
      <div class="dl-name" id="dlName">file.dat</div>
      <div class="dl-bar-wrap">
        <div class="dl-bar-fill" id="dlBarFill"></div>
      </div>
      <div class="dl-pct" id="dlPct">0%</div>
    </div>
  </div>

  <!-- hl2_launcher.js embedded below - this is the complete game launcher -->
  <script id="hl2-launcher">
    // EMBEDDED HL2_LAUNCHER.JS - Fetches WASM and .so files from GitHub Raw
    
    console.log('hl2_launcher embedded initialization');

    // GitHub raw content base URL
    const GITHUB_RAW_BASE = 'https://raw.githubusercontent.com/denduednue/p125/main/';
    
    // List of required game files (will be fetched as needed)
    const GAME_FILES = {
      wasm: 'hl2_launcher.wasm',
      libs: [
        'libclient.so',
        'libengine.so',
        'libserver.so',
        'libGameUI.so',
        'libServerBrowser.so',
        'libdatacache.so',
        'libfilesystem_stdio.so',
        'libinputsystem.so',
        'liblauncher.so',
        'libmaterialsystem.so',
        'libscenefilecache.so',
        'libshaderapidx9.so',
        'libsoundemittersystem.so',
        'libstdshader_dx9.so',
        'libsteam_api.so',
        'libstudiorender.so',
        'libtier0.so',
        'libtogl.so',
        'libvaudio_minimp3.so',
        'libvgui2.so',
        'libvguimatsurface.so',
        'libvideo_services.so',
        'libvphysics.so',
        'libvstdlib.so',
        'libvtex_dll.so'
      ]
    };

    // Asset cache
    const assetCache = {};

    // Update UI
    function updateProgress(percent) {
      const bar = document.getElementById('progressBar');
      if (bar) bar.style.width = percent + '%';
      const text = document.getElementById('loadingText');
      if (text) text.textContent = 'LOADING ASSETS... ' + Math.floor(percent) + '%';
    }

    function logOutput(message) {
      const output = document.getElementById('output');
      if (output) {
        output.value += message + '\n';
        output.scrollTop = output.scrollHeight;
      }
      console.log(message);
    }

    function setStatus(status) {
      const statusEl = document.getElementById('statusText');
      if (statusEl) statusEl.textContent = status;
    }

    // Fetch asset from GitHub with error handling
    async function fetchAsset(filename) {
      if (assetCache[filename]) {
        return assetCache[filename];
      }

      try {
        const url = GITHUB_RAW_BASE + filename;
        logOutput(`[FETCH] Loading ${filename}...`);
        
        const response = await fetch(url, {
          mode: 'cors',
          credentials: 'omit'
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const arrayBuffer = await response.arrayBuffer();
        assetCache[filename] = arrayBuffer;
        logOutput(`[FETCH] ✓ ${filename} (${(arrayBuffer.byteLength / 1024 / 1024).toFixed(2)} MB)`);
        return arrayBuffer;
      } catch (error) {
        logOutput(`[ERROR] Failed to fetch ${filename}: ${error.message}`);
        throw error;
      }
    }

    // Load all game assets
    async function loadGameAssets() {
      try {
        logOutput('[INIT] Starting asset loader...');
        setStatus('LOADING');
        
        let loadedCount = 0;
        const totalFiles = 1 + GAME_FILES.libs.length; // WASM + all .so files

        // Load WASM
        updateProgress(5);
        logOutput('[ASSETS] Loading WebAssembly module...');
        try {
          await fetchAsset(GAME_FILES.wasm);
          loadedCount++;
          updateProgress((loadedCount / totalFiles) * 90 + 5);
        } catch (e) {
          logOutput('[WARN] WASM not available, game may not run');
        }

        // Load libs (non-blocking, load in background)
        logOutput('[ASSETS] Pre-loading game libraries (background)...');
        GAME_FILES.libs.forEach((lib, index) => {
          setTimeout(async () => {
            try {
              await fetchAsset(lib);
              loadedCount++;
              const progress = (loadedCount / totalFiles) * 90 + 5;
              updateProgress(progress);
            } catch (e) {
              logOutput(`[WARN] Library ${lib} not available`);
            }
          }, index * 200); // Stagger requests
        });

        // Wait a moment for initial loads
        await new Promise(resolve => setTimeout(resolve, 1000));
        
        logOutput('[INIT] Asset loading complete');
        return true;
      } catch (error) {
        logOutput(`[ERROR] Asset loading failed: ${error.message}`);
        return false;
      }
    }

    // Mock Module object for Emscripten (from original hl2_launcher.js)
    var Module = typeof Module != 'undefined' ? Module : {};
    
    Module['arguments'] = Module['arguments'] || [];
    Module['arguments'].push(
      '-game', 'portal',
      '-noip',
      '-language', 'english',
      '-windowed',
      '+mat_hdr_level', '0',
      '+mat_colorcorrection', '1'
    );

    // DataLoader class (from original hl2_launcher.js pre.js)
    class DataLoader {
      mapsOrdered = [
        'background1',
        'testchmb_a_00',
        'testchmb_a_01',
        'testchmb_a_02',
        'testchmb_a_03',
        'testchmb_a_04',
        'testchmb_a_05',
        'testchmb_a_06',
        'testchmb_a_07',
        'testchmb_a_08',
        'testchmb_a_09',
        'testchmb_a_10',
        'testchmb_a_11',
        'testchmb_a_13',
        'testchmb_a_14',
        'testchmb_a_15',
        'escape_00',
        'escape_01',
        'escape_02',
        'background2',
      ];

      loadedMaps = {};

      async loadMapWithDeps(mapName) {
        const index = this.mapsOrdered.indexOf(mapName);
        if(index === -1) {
          throw new Error(`no such map: ${mapName}`);
        }

        for(let i = 0; i < index + 1; i++) {
          await this.loadMapCached(this.mapsOrdered[i]);
        }

        const next = this.mapsOrdered[index + 1];
        if(next) {
          this.loadMapCached(next);
        }
      }

      async loadMapCached(mapName) {
        if(mapName in this.loadedMaps) return this.loadedMaps[mapName];
        const promise = this.loadMap(mapName);
        this.loadedMaps[mapName] = promise;
        return promise;
      }

      async loadMap(mapName) {
        logOutput(`[MAP] Loading ${mapName}...`);
        // Placeholder - actual map loading would use chunks/
        return Promise.resolve();
      }
    }

    const dataLoader = new DataLoader();
    Module.downloadMap = (lock, mapName) => {
      dataLoader.loadMapWithDeps(mapName).then(() => {
        logOutput(`[MAP] ${mapName} ready`);
      }).catch(e => {
        logOutput(`[MAP] Error loading ${mapName}: ${e.message}`);
      });
    };

    // Initialize
    async function initializeGame() {
      try {
        updateProgress(10);
        logOutput('[INIT] Portal Game Launcher - Standalone Edition');
        logOutput('[INIT] Loading from GitHub: ' + GITHUB_RAW_BASE);

        const assetsReady = await loadGameAssets();

        if (assetsReady) {
          setStatus('ONLINE');
          logOutput('[INIT] ✓ Game initialization complete');
          logOutput('[INIT] WASM module and libraries loaded from GitHub');
          logOutput('[READY] Game is ready to start');
        } else {
          setStatus('ERROR');
          logOutput('[ERROR] Failed to load game assets');
        }

        updateProgress(100);
        setTimeout(() => {
          const overlay = document.getElementById('loadingOverlay');
          if (overlay) overlay.classList.add('hidden');
        }, 1500);

      } catch (error) {
        setStatus('ERROR');
        logOutput('[FATAL] ' + error.message);
        updateProgress(100);
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) overlay.classList.add('hidden');
      }
    }

    // Start when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeGame);
    } else {
      initializeGame();
    }
  </script>

  <script>
    // Fullscreen button handler
    document.getElementById('btnFullscreen')?.addEventListener('click', function() {
      const canvas = document.getElementById('canvas');
      const overlay = document.getElementById('fsOverlay');
      if (canvas && overlay) {
        if (overlay.classList.contains('active')) {
          overlay.classList.remove('active');
          overlay.innerHTML = '';
        } else {
          overlay.classList.add('active');
          const clonedCanvas = canvas.cloneNode(true);
          overlay.innerHTML = '';
          overlay.appendChild(clonedCanvas);
        }
      }
    });
  </script>
</body>
